project: FRANK
description: "FRANK debug protocol — stderr JSONL state-change events for AI-agent-debuggable TUIs. Companion to JUI (eidos/JUI)."

phases:
  - id: phase-1
    name: "Phase 1: Standalone Extraction from Igor Monorepo"
    status: completed
    depends_on: []
    items:
      - name: "Copy FRANK package from igor/FRANK/ to standalone eidos/FRANK repo"
        done: true
      - name: "Create eidos/FRANK Forgejo repo (private, eidos org)"
        done: true
      - name: "CLAUDE.md, ROADMAP.yaml, .gitignore present"
        done: true
      - name: "Project.toml: name=FRANK, uuid, version=0.1.0, deps=[JSON3, Dates]"
        done: true
      - name: "spec/frank-v0.1.json: JSON Schema for event envelope"
        done: true
      - name: "test/runtests.jl: 12 test sets covering all EventType values, JSON roundtrip, concurrency, edge cases"
        done: true
      - name: "Initial commit + push to eidos/FRANK main"
        done: true

  - id: phase-2
    name: "Phase 2: JUI Integration via Weak Dep"
    status: not-started
    depends_on: [phase-1]
    items:
      - name: "Add FRANK as optional weak dep in JUI via Julia 1.9+ package extension ([weakdeps] + JUIFRANKExt)"
        done: false
      - name: "JUI works identically when FRANK is NOT loaded (no crash, no overhead in hot path)"
        done: false
      - name: "Session lifecycle events emit FRANK JSONL when FRANK is loaded: session_create, session_close, input_received, diff_emitted, snapshot_sent"
        done: false
      - name: "Event schema: FRANK v0.1 JSON schema extended with JUI-specific event types"
        done: false
      - name: "Tests: FRANK-loaded path (events emit correctly) + FRANK-absent path (zero mentions, no errors)"
        done: false
      - name: "Register FRANK in eidos Forgejo Julia registry so JUI can declare it as weakdep"
        done: false

  - id: phase-3
    name: "Phase 3: Agent Subscription API"
    status: not-started
    depends_on: [phase-2]
    items:
      - name: "Agent attach API: third-party agent can subscribe to FRANK event stream for a given SessionID"
        done: false
      - name: "Subscription auth: token-gated (same model as JUI ET-transport auth gate)"
        done: false
      - name: "FRANK v0.2 schema: add subscription envelope + SessionID field"
        done: false
      - name: "spec/frank-v0.2.json: JSON Schema update for agent subscription events"
        done: false
      - name: "Docs: how to attach an agent to a live JUI session via FRANK (1-page integration guide)"
        done: false
      - name: "Integration test: agent subscribes, JUI session emits, agent receives stream"
        done: false
